[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathtrace-ai"
version = "0.1.0"
description = "An algebra solution verification and feedback system."
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.14.0",
    "streamlit>=1.66.1",
    "Pillow>=13.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]